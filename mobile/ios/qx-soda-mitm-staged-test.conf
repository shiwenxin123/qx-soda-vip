# 汽水音乐 —— 分阶段验证 MITM 能不能用（iOS）
#
# 目的：用**风险最小**的方式回答一个问题 —— 汽水到底让不让 QX 解密？
#
# 为什么要在广告域名上试，而不是业务域名：
#   业务域名被 pinning 拒掉 → App 直接「网络出错」（你 23:46 那次就是）
#   广告域名被拒 → 最多是广告加载失败，不影响听歌
#
# 操作顺序（每步都要重启 VPN，并观察 QX 网络活动顶部的 JS 计数）

## 第 1 步：只解密一个广告域名

```
[mitm]
hostname = ads5-normal-gl2.zijieapi.com

[rewrite_local]
^https?:\/\/ads5-normal-gl2\.zijieapi\.com\/ url script-request-header https://cdn.jsdelivr.net/gh/shiwenxin123/qx-soda-vip@main/mobile/ios/qx_soda_ad_probe.js
```

保存 → 重启 VPN → 打开汽水，滑几屏让它请求广告。

看结果：

| 现象 | 结论 | 下一步 |
|---|---|---|
| 网络活动里这条显示 **JS 计数 +1**、能看到请求路径 | ✅ **能解密** | 进第 2 步 |
| 这条 `0B/0B`、`N/A`、JS 仍是 0 | ❌ **被 pinning 挡了** | 停，走「pinning 应对」 |
| App 报网络错误 | ❌ pinning + 影响主流程 | 立刻删掉这行 |

## 第 2 步（仅当第 1 步 ✅）：找出真正的业务 API 域名

第 1 步证明能解密后，业务域名也可能能解密（但**不保证**，不同域名可能不同策略）。

在 `hostname` 里**逐个**加，一次只加一个，每次都重启 VPN 并试播一首歌：

```
hostname = ads5-normal-gl2.zijieapi.com, api5-normal-c-lf.zijieapi.com
```

> 业务域名不要一次全加。上次就是一次加了 6 个 qishui 域名，
> 结果 App 全挂、还分不清是哪个的问题。

能解密的业务域名出现后，把 `soda_vip_unlock.js` 的匹配规则指到它：

```
[rewrite_local]
^https?:\/\/api5-normal-c-lf\.zijieapi\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/shiwenxin123/qx-soda-vip@main/soda_vip_unlock.js
```

## 第 3 步：验证 VIP 改写是否生效

不看播放条，看 QX 网络活动里该请求的**响应体**（点进去能看到 JSON）：
- 搜 `is_vip` / `has_play_entitlement` → 应该是 `true`
- 搜 `only_vip_playable` → 应该是 `false`

如果响应体里根本没有这些字段，说明会员态走的是另一个接口，
或者被加密了（字节的接口常用 protobuf / 私有加密），那就不是脚本能改的层次。

## pinning 应对（第 1 步 ❌ 时）

iOS 不越狱没有通用绕过。三个现实选项：

1. **越狱 + Frida**（唯一能彻底解决的）
   ```
   frida -U -f com.soda.music -l frida_pinning_bypass.js
   ```
   脚本在 `mobile/android/frida_pinning_bypass.js`，iOS 通用。

2. **只用去广告那套**（`qx-soda-ads.conf`，连接层 REJECT，不碰 TLS）
   —— 会员功能解不开，但广告能去掉，且绝不会再搞坏网络。

3. **iPhone 只听歌**，会员功能用 Mac 版（`/Applications/汽水音乐 VIP.app`，已验证可用）。
