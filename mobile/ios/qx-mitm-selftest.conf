# QX MITM 自检（不碰汽水，零风险）
#
# 目的：在折腾汽水之前，先确认「QX 到底能不能解密 HTTPS」。
#       广告还在 + VIP 不生效 + 一加 MITM 就断网 —— 这三个症状指向同一个根因：
#       **QX 根证书没有被系统信任**，而不是汽水 pinning。
#
# 两者症状完全一样（都是 TLS 握手失败 → App 报网络错误），所以必须先分清。

## 操作（3 分钟）

1. 把下面两段合并进 QX 配置
2. 保存 → **关掉 VPN 再打开**
3. iPhone Safari 打开：https://httpbin.org/get
4. 看结果

```
[rewrite_local]
^https?://httpbin\.org/ url script-response-body https://cdn.jsdelivr.net/gh/shiwenxin123/qx-soda-vip@main/mobile/ios/qx_mitm_selftest.js

[mitm]
hostname = httpbin.org
```

## 结果判读

| 现象 | 结论 |
|---|---|
| 弹通知「✅ MITM 正常」，页面正常显示 JSON | **MITM 通**，问题在汽水 pinning |
| 页面能打开但**没有**通知，QX 里 JS 计数是 0 | 解密没生效：证书没信任 / MITM 开关没开 |
| Safari 提示「此连接非私人连接」/ 页面打不开 | **证书没信任**（最常见） |

## 如果是「证书没信任」

按顺序检查，漏一步都不行：

1. QX → 设置 → MitM → **生成证书**（已生成可跳过）
2. QX → 设置 → MitM → **配置证书** → 跳 Safari 下载描述文件 → 允许
3. iOS **设置 → 通用 → VPN与设备管理** → 点 `Quantumult X CA ...` → **安装**
4. iOS **设置 → 通用 → 关于本机 → 证书信任设置** → 打开 `Quantumult X CA` 开关 ← **90% 的人漏这步**
5. QX → 设置 → MitM → 打开 **MitM** 总开关
6. QX → 设置 → 重写 → 打开 **重写** 总开关

做完重新跑一次上面的自检。**自检通过之前，不要给汽水加任何 MITM 域名。**

## 自检通过后

再按 `qx-soda-mitm-staged-test.conf` 的三步法，一次只加一个域名。
先加广告域名（坏了不影响听歌），确认 JS 计数 +1，再考虑业务域名。

## 为什么「广告还在」也指向同一个根因

如果广告是**内嵌在接口 JSON 里**下发的（字节系 App 常见做法），
那么在连接层 REJECT 广告 CDN 是没用的 —— 广告数据早就跟着主接口回来了，
只是素材下载被拒，App 会显示占位图或直接跳过素材。

这种广告只能靠**改响应体**去掉，也就是必须 MITM 生效。
所以「广告还在」和「VIP 不生效」其实是同一个问题的两个表现。
