# QX MITM 自检 v2 —— 用「页面内容被改」来判定，不靠通知
#
# ⚠ 为什么改版：
#   你上一步打开 httpbin.org/get 能正常显示 JSON，这**证明不了 MITM 生效**。
#   因为「QX 没解密、原样转发」时页面也是正常显示的。
#
#   v2 的做法：脚本往返回的 JSON 里塞一个字段 `MITM_SELFTEST`。
#   - 页面上**能看到** `MITM_SELFTEST` → MITM + 重写 都生效
#   - 页面上**看不到** → 没生效（页面照样能打开，但内容是原始的）
#
# 注意：改了脚本内容，jsDelivr 有缓存。
#   如果你之前在 QX 里加过这条规则，**先删掉再重新加**，否则拿到的还是旧脚本。

## 配置

```
[rewrite_local]
^https?://httpbin\.org/ url script-response-body https://cdn.jsdelivr.net/gh/shiwenxin123/qx-soda-vip@main/mobile/ios/qx_mitm_selftest.js

[mitm]
hostname = httpbin.org
```

保存 → 重启 VPN → Safari 打开 `https://httpbin.org/get`

## 判读（只看一件事）

| 页面里有没有 `MITM_SELFTEST` | 结论 | 下一步 |
|---|---|---|
| **有** | ✅ MITM 通、重写通 | 说明之前 qishui 断网 = **pinning**。走下面的「下一步」 |
| **没有** | ❌ 重写没生效 | 查：重写总开关 / 规则是否保存 / 脚本地址能否访问 |

> 补充一个已知信号：如果 Safari 打开 httpbin 时**没有**任何证书警告，
> 说明 QX 根证书**已经**被信任（不信任的话 Safari 会拦「非私人连接」）。
> 那问题就只可能在「重写开关」或「规则没存上」。

## 下一步（自检通过后）

MITM 通了但 qishui 断网 → 确认是 pinning。但**不一定所有域名都 pin**。
字节系有些接口只在关键域名上做校验，广告/日志域名常常是裸的。

按这个顺序试，**一次只加一个**，每次重启 VPN 并试播一首歌：

### 试探 1：广告域名（最安全，坏了不影响听歌）

```
[mitm]
hostname = ads5-normal-gl2.zijieapi.com
```

打开汽水滑几屏，看 QX 网络活动里这条的 **JS 计数是否 +1**。

- `+1` → 这个域名没 pin，**有戏**，进试探 2
- `0` 且连接 `0B/0B` → 这个域名也 pin，基本可以判死刑

### 试探 2：业务域名（只在试探 1 成功时做）

```
[mitm]
hostname = ads5-normal-gl2.zijieapi.com, api5-normal-c-lf.zijieapi.com
```

播放一首 VIP 歌，看这条连接是否 `0B/0B`。

- 能解密 → 把 `soda_vip_unlock.js` 的匹配规则指到它，VIP 就能生效
- `0B/0B` → 业务域名 pin 了，广告域名不 pin 也没用（改不了会员态）

### 结论分支

| 试探1 | 试探2 | 结果 |
|---|---|---|
| ✅ | ✅ | 完整可用：VIP + 去广告都能做 |
| ✅ | ❌ | 只能去广告（改广告响应），VIP 无解 |
| ❌ | — | 全线 pinning，iOS 不越狱到此为止 |
