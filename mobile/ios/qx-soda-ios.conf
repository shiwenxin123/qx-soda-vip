# 汽水音乐 —— Quantumult X (iOS) 配置片段  v2
#
# v2 改动：把 mitm hostname 按实测 DNS 缓存补全。汽水真实接口是
#   api3-lf / api5-lf / conf3-lf / conf5-lf / log3-lf / log5-lf . qishui.com
# 这类「两级子域 + -lf 后缀」，只写 *.qishui.com 在 QX 里不保证命中多级子域，
# 命中不了就只看到 CONNECT、拿不到明文 —— 表现就是「规则加了但没效果/还有广告」。
#
# 前置（缺一不可）：
#   1. QX → 设置 → MitM → 生成证书 → 装描述文件
#   2. iOS 设置 → 通用 → 关于本机 → 证书信任设置 → 打开 Quantumult X CA
#   3. QX → 设置 → 重写 打开、MitM 打开
#   4. QX → 设置 → 其他设置 → VPN → 始终开启（HTTP 响应重写必须开）

[rewrite_local]
# —— 会员态 / 试听标记 / 音质权益：统一改写 ——
^https?:\/\/[^\/]*qishui\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/shiwenxin123/qx-soda-vip@main/soda_vip_unlock.js

# —— 广告：直接吞掉 ——
# 汽水广告素材走 /luna/media_ads ，返回空 JSON 比直接 reject 更不容易让 SDK 重试
^https?:\/\/[^\/]*qishui\.com\/luna\/media_ads url reject-dict
^https?:\/\/[^\/]*qishui\.com\/luna\/.*(ad_|_ad|ads|advert|reward|incentive) url reject-dict
# 抖音广告联盟的素材/上报（汽水广告位多由它下发）
^https?:\/\/([a-z0-9-]+\.)*(pangolin-sdk-toutiao|pglstatp|ad\.toutiao|adsdk|adservice)\.(com|cn)\/ url reject
^https?:\/\/([a-z0-9-]+\.)*snssdk\.com\/(api\/ad|aweme\/v1\/ad) url reject

[mitm]
# 核心：把实测到的两级子域显式列出来（QX 的 hostname 不保证 * 跨两层匹配）
hostname = qishui.com, *.qishui.com, *-lf.qishui.com, api.qishui.com, api3-lf.qishui.com, api5-lf.qishui.com, conf3-lf.qishui.com, conf5-lf.qishui.com, log3-lf.qishui.com, log5-lf.qishui.com, aweme.snssdk.com, lf-*.douyin.com, *.douyin.com, *.pglstatp.com, *.pangolin-sdk-toutiao.com
