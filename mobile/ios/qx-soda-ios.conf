# 汽水音乐 VIP 解锁 —— Quantumult X (iOS) 配置片段
# 合并进你现有的配置里：只需 [rewrite_local] 那一行 + [mitm] 里补 hostname。
#
# 前置（缺一不可）：
#   1. QX → 设置 → MitM → 生成证书 → 安装描述文件
#   2. iOS 设置 → 通用 → 关于本机 → 证书信任设置 → 打开 Quantumult X CA
#   3. QX → 设置 → 重写 打开、MitM 打开
#   4. QX → 设置 → 其他设置 → VPN → 始终开启（HTTP 响应重写必须开）

[rewrite_local]
# 汽水所有 *.qishui.com 的 JSON 响应统一改写
^https?:\/\/[^\/]*qishui\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/shiwenxin123/qx-soda-vip@main/soda_vip_unlock.js

[mitm]
# 按 QX「网络活动」里实际出现的域名增减；下面这套覆盖主站与多级子域
hostname = *.qishui.com, api.qishui.com, aweme.snssdk.com, lf-*.douyin.com, *.douyin.com
