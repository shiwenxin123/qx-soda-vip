# 出问题时用这段「回滚」：把汽水从 MITM 里摘出去，恢复 App 正常联网
#
# 现象：加了 hostname 之后汽水开始「网络出错，请检查网络」，
#       QX 网络活动里 qishui 的连接全是 0B / N/A / 红叉，JS 计数一直是 0
#       → 说明 QX 尝试解密但这些连接被 App 的证书校验(pinning)拒了。
#
# 做法：把下面这行贴进 QX 配置的 [mitm] 段，替换掉原来那行 hostname
#       （也就是把所有 qishui 相关条目删掉），保存后重启 VPN。
#
# 如果 QX 只有一行 hostname，就把 qishui 开头的条目逐个删掉，保留其它。

[mitm]
# 保留你自己原来的其它主机，这里只给一个最小示例：
hostname = aweme.snssdk.com, lf-*.douyin.com, *.douyin.com
