# 汽水音乐 —— 去广告（iOS / Quantumult X）
#
# ★ 关键：这一段 **不需要 MITM、不需要证书、不碰 TLS**
#   所以不会被汽水的证书校验(pinning)挡住，也不会再把 App 搞成「网络出错」。
#
# 原理：在连接层直接拒绝广告域名，而不是解密后改内容。
#   - REJECT      → 立刻 RST，广告 SDK 通常几百毫秒内放弃，不拖慢页面
#   - 不用 reject-dict / reject-200 之类（那些属于重写，要 MITM）
#
# 用法：把 [filter_local] 里的行合并进你 QX 配置的 [filter_local] 段
#       （没有这一段就在文件末尾新建一段），保存 → 重启 VPN。
#
# 实测依据（2026-11-14 23:59 网络活动截图）：
#   ads5-normal-gl2.zijieapi.com   广告 API，有 9KB 下行 / 5KB 上行
#   lf-reward-video.bytedcdn.com   激励视频素材
#   lf-res-3.douyinstatic.com      静态资源（含广告位图标，但不建议整段拒）
#   v11-luna.douyinvod.com         音视频 CDN —— 千万别拒，拒了就不出声了
#   app-alpha.bytedance.net        字节配置下发 —— 别拒，拒了可能起不来

[filter_local]
# ---- 广告 API ----
HOST-SUFFIX, ads5-normal-gl2.zijieapi.com, REJECT
HOST-SUFFIX, ads.zijieapi.com, REJECT
HOST-SUFFIX, ad.zijieapi.com, REJECT
HOST-SUFFIX, adsdk.zijieapi.com, REJECT
HOST-SUFFIX, ads-normal.zijieapi.com, REJECT

# ---- 激励视频素材（拒掉 = 广告无素材可播，多数实现直接判失败跳过）----
HOST-SUFFIX, lf-reward-video.bytedcdn.com, REJECT
HOST-SUFFIX, reward-video.bytedcdn.com, REJECT

# ---- 巨量/穿山甲广告联盟 ----
HOST-SUFFIX, pglstatp.com, REJECT
HOST-SUFFIX, pangolin-sdk-toutiao.com, REJECT
HOST-SUFFIX, ad.toutiao.com, REJECT
HOST-SUFFIX, adservice.com, REJECT
HOST-SUFFIX, csjplatform.com, REJECT

# ---- 注意：以下这些**不要**拒 ----
# v11-luna.douyinvod.com     音视频 CDN，拒了歌就放不出来
# lf-res-3.douyinstatic.com  静态资源（封面/图标），拒了界面会缺图
# app-alpha.bytedance.net    配置下发，拒了可能启动异常
