# 汽水音乐 VIP 解锁 —— Quantumult X 规则
#
# 用法：
#   1. QX → 设置 → MitM → 生成并安装证书 → 到 macOS「钥匙串访问」把证书设为始终信任
#   2. QX → 配置文件 → 编辑，把下面 [rewrite_local] 与 [mitm] 两段合并进现有配置
#   3. 把 soda_vip_unlock.js 放到 QX 的脚本目录（或在 [rewrite_local] 里换成脚本的引用名）
#   4. 重写 → 打开「重写」总开关，QX 保持运行（Mac 上需要有流量接管：VPN 配置生效）
#
# 说明：hostname 里的域名按实际抓包结果增减。汽水 Mac 端业务接口主要在
#       api.qishui.com（luna/pc/*）；部分能力走 aweme.snssdk.com。
#       QX → 首页 → 「流量」里能看到真实域名，缺哪个补哪个。

[rewrite_local]
^https?:\/\/api\.qishui\.com\/ url script-response-body soda_vip_unlock.js
^https?:\/\/[a-z0-9-]+\.qishui\.com\/ url script-response-body soda_vip_unlock.js
^https?:\/\/aweme\.snssdk\.com\/aweme\/v1\/(get|query|feed|commit|list) url script-response-body soda_vip_unlock.js

[mitm]
hostname = api.qishui.com, *.qishui.com, aweme.snssdk.com, lf-*.douyin.com, luna-web.douyin.com
